worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;

    underscores_in_headers on;

    map $http_client_type $web_limit_key {
        default  $binary_remote_addr;
        mobile   $request_id;
    }

    map $http_client_type $mobile_limit_key {
        default  $request_id;
        mobile   $binary_remote_addr;
    }

    limit_req_zone  $web_limit_key     zone=web_api:10m   rate=50r/s;
    limit_req_zone  $mobile_limit_key  zone=mobile_api:10m rate=30r/s;

    limit_req_status 429;

    upstream backend {
        server localhost:8081;
    }

    server {
        listen 8080;
        server_name _;

        location /api/ {
            limit_req zone=web_api burst=100 nodelay;
            limit_req zone=mobile_api burst=60 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 8081;
        server_name _;

        location /api/ {
            add_header Content-Type application/json;

            if ($http_client_type = "mobile") {
                return 200 '{"status":"ok","service":"api","channel":"mobile"}';
            }

            return 200 '{"status":"ok","service":"api","channel":"web"}';
        }
    }
}