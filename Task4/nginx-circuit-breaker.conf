worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;

    map "$arg_type:$remote_addr" $random_ok {
        default                  0;
        ~^random:.*[13579]$     1;
    }

    upstream logistics_backend {
        server localhost:9090 max_fails=5 fail_timeout=30s;
    }

    server {
        listen 8080;
        server_name _;

        location /logistics/ {
            proxy_pass http://logistics_backend;
            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_intercept_errors on;

            error_page 500 502 503 504 = @fallback;
        }

        location @fallback {
            default_type application/json;
            return 503 '{"status":"error","service":"logistics","error":"service_unavailable","message":"Сервис логистики временно недоступен, запрос отклонён защитным контуром"}';
        }
    }

    server {
        listen 9090;
        server_name _;

        location / {
            if ($arg_type = "fast") {
                return 200 "Ответ сервиса логистики (быстрый)";
            }
            if ($arg_type = "slow") {
                limit_rate 10;
                return 200 "Медленный ответ сервиса логистики";
            }
            if ($arg_type = "error") {
                return 500 "Внутренняя ошибка сервиса логистики";
            }
            if ($random_ok = 1) {
                return 200 "Ответ сервиса логистики (случайно: успех, последняя цифра IP нечётная)";
            }
            if ($arg_type = "random") {
                return 500 "Внутренняя ошибка сервиса логистики (случайно: последняя цифра IP чётная)";
            }
            return 404 "Неизвестный тип запроса, используйте ?type=fast|slow|error|random";
        }
    }
}